# Облачная проверка Docker-образа (то же, что docker build / docker run на своей машине):
#  1) сборка образа;  2) модульные тесты в контейнере;  3) тестовый бэг из записи Falcon организаторов (потоково по
#  публичной ссылке, без скачивания архива);  4) офлайн-оценка бэга без сети;  5) живой запуск ROS 2 + RViz на
#  виртуальном дисплее: снимок экрана RViz, частота /tunnel_guard/status;  6) публикация образа в ghcr.io.
name: docker

on:
  push:
    branches: [main]
    paths: ['src/**', 'docker/**', 'Dockerfile', 'tools/falcon_*.py', 'tools/sqlstream.py', 'tools/sqlpages.py',
            'tools/export_bag.py', 'tools/cloud_live_check.py', 'tools/cloud_controls_check.py', 'tools/native_benchmark.py', '.github/workflows/docker.yml']
  workflow_dispatch:
    inputs:
      frames:
        description: 'кадры записи Falcon для тестового бэга (first last)'
        default: '0 300'

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на раннере
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Сборка образа
        run: docker build -t tunnel_guard .

      - name: Модульные тесты в контейнере
        run: >-
          docker run --rm tunnel_guard bash -c "cd /tmp && python3 -c
          'import tunnel_guard; from tunnel_guard.core.geometry import HAVE_NATIVE; assert HAVE_NATIVE;
          import pytest; raise SystemExit(pytest.main([\"-q\", \"/ws/src/tunnel_guard/test\"]))'"

      - name: Тестовый бэг из записи Falcon (потоково с Яндекс.Диска организаторов)
        env:
          FRAME_SELECTION: ${{ github.event.inputs.frames || '0 300' }}
        run: |
          pip install --quiet zstandard numpy
          read -r FIRST LAST <<< "$FRAME_SELECTION"
          [[ "$FIRST" =~ ^[0-9]+$ && "$LAST" =~ ^[0-9]+$ ]]
          echo "EXPECTED=$((LAST - FIRST + 1))" >> "$GITHUB_ENV"
          python tools/falcon_export_bag.py bags/falcon_test "$FIRST" "$LAST"
          ls -la bags/falcon_test

      - name: Численный паритет и время ядра C++ / Numba
        run: |
          mkdir -p results
          docker run --rm -v "$PWD/tools:/tools:ro" -v "$PWD/results:/results" tunnel_guard python3 /tools/native_benchmark.py /results/native_benchmark.json

      - name: Офлайн-оценка в контейнере без сети (--network none)
        run: |
          mkdir -p results
          docker run --rm --network none -v "$PWD/bags:/data" -v "$PWD/results:/results" tunnel_guard \
            ros2 run tunnel_guard evaluate_bag --bag /data/falcon_test --out /results/falcon_test
          cat results/falcon_test_summary.json

      - name: Живой запуск ROS 2 + RViz (виртуальный дисплей), снимок экрана и частота выдачи
        run: |
          docker run --rm -v "$PWD/bags:/data" -v "$PWD/results:/results" -v "$PWD/tools:/tools:ro" -e LIBGL_ALWAYS_SOFTWARE=1 -e EXPECTED="$EXPECTED" tunnel_guard bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq xvfb imagemagick > /dev/null
            Xvfb :99 -screen 0 1600x900x24 & export DISPLAY=:99; sleep 2
            python3 /tools/cloud_live_check.py --bag /data/falcon_test --out /results --expected "$EXPECTED"
          '

      - name: Пауза, покадровый шаг, скорость и переключение бэгов без перезапуска
        run: |
          docker run --rm -v "$PWD/bags:/data" -v "$PWD/results:/results" -v "$PWD/tools:/tools:ro" tunnel_guard python3 /tools/cloud_controls_check.py /data/falcon_test /results

      - name: Результаты (бэг не публикуется - это данные организаторов)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunnelguard-results
          path: results/

      - name: Публикация образа в ghcr.io (docker pull без сборки)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/tunnel_guard
          docker tag tunnel_guard $IMG:latest && docker push $IMG:latest
