name: generalization-eval
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generalization-eval
  cancel-in-progress: true
jobs:
  spatial-fusion-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Frozen current runtime and candidate, native tests
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker build -t tg_candidate .
          IMG=$(python3 -c "import json; print(json.load(open('docs/reproduction_lock.json'))['base_image'])")
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          docker pull "$IMG"
          docker run --rm tg_candidate bash -c 'cd /tmp; python3 -m pytest -q /ws/src/tunnel_guard/test'
      - name: Stream full Falcon recording
        run: |
          pip install --quiet numpy zstandard
          python tools/falcon_export_bag.py bags/falcon_test 0 4442
      - name: Current pinned runtime, all 4443 scans
        run: |
          mkdir -p results/baseline results/candidate results/holdout
          docker run --rm --network none -v "$PWD/bags:/data:ro" -v "$PWD/tools:/tools:ro" -v "$PWD/docs:/docs:ro" -v "$PWD/results:/results" "$IMG" python3 /tools/finals_improvement_eval.py /data/falcon_test /docs/finals/reference_automatic.json /results/baseline --source-label pinned-2e2cee7
      - name: Candidate, full scan video export and 68 injection cases
        run: |
          docker run --rm --network none -v "$PWD/bags:/data:ro" -v "$PWD/tools:/tools:ro" -v "$PWD/docs:/docs:ro" -v "$PWD/results:/results" tg_candidate python3 /tools/finals_improvement_eval.py /data/falcon_test /docs/finals/reference_automatic.json /results/candidate --source-label "$GITHUB_SHA" --clip-stride 1 --ladder
      - name: Candidate, 255 previously frozen regression conditions
        run: |
          docker run --rm --network none -v "$PWD/bags:/data:ro" -v "$PWD/tools:/tools:ro" -v "$PWD/docs:/docs:ro" -v "$PWD/results:/results" tg_candidate python3 /tools/finals_holdout_eval.py /data/falcon_test /docs/finals/reference_automatic.json /results/holdout --label "$GITHUB_SHA"
      - name: Reject quality regressions before promotion
        run: python3 tools/finals_spatial_gate.py results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-fusion-results
          path: results/
