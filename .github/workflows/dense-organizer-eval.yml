name: dense-organizer-eval
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Unpublished temporary data release ID'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: dense-organizer-eval
  cancel-in-progress: true
jobs:
  three-complete-bags:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build installed detector and GUI
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker build -t tg_dense .
          docker build --build-arg TG_BASE=tg_dense -f Dockerfile.gui -t tg_dense_gui .
          df -h /
      - name: Fetch unpublished data and verify every SHA256
        env:
          TG_DATA_TOKEN: ${{ github.token }}
          DATA_RELEASE: ${{ inputs.release_id }}
        run: |
          pip install --quiet requests numpy zstandard pyyaml pillow matplotlib imageio imageio-ffmpeg
          if [ -n "$DATA_RELEASE" ]; then
            python tools/cloud_dense_data.py download "$DATA_RELEASE" private_data/new_synth_data.zst
          else
            python tools/cloud_dense_data.py public-download https://disk.yandex.ru/d/SfBeRHbs8bNJAQ private_data/new_synth_data.zst
            cp private_data/new_synth_data_source.json private_data/source.json
          fi
          python tools/cloud_dense_data.py extract private_data/new_synth_data.zst bags
      - name: Full installed detector and sampled visualization output
        run: |
          mkdir -p results/offline
          docker run --rm --network none -e TG_SOURCE_SHA="$GITHUB_SHA" -v "$PWD/bags:/data:ro" -v "$PWD/tools:/tools:ro" -v "$PWD/results:/results" tg_dense python3 /tools/finals_organizer_bundle.py /data /results/offline --clip-stride 1
      - name: Full ROS and RViz replay, every message from all three bags
        run: |
          mkdir -p results
          cp private_data/source.json results/source.json
          cp bags/bags.json results/bags.json
          cp bags/extraction.json results/extraction.json
          lscpu > results/cpu.txt
          docker run -d --shm-size=512m --name tg_dense -e TG_GUI_AUTOSTART=0 -v "$PWD/bags:/data:ro" -v "$PWD/tools:/tools:ro" -v "$PWD/results:/results" tg_dense_gui
          for i in $(seq 1 30); do
            if docker exec tg_dense python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:6080/vnc.html',timeout=2)"; then break; fi
            sleep 1
          done
          failed=0
          for spec in 'synthetic_platform_cloud_only 386' 'synthetic_switch_cloud_only 736' 'synthetic_tunnels_cloud_only 545'; do
            read -r name count <<< "$spec"
            mkdir -p "results/$name"
            if ! docker exec tg_dense bash -c 'source /opt/ros/humble/setup.bash; source /ws/install/setup.bash; python3 /tools/cloud_live_check.py --bag /data/'"$name"' --out /results/'"$name"' --expected '"$count"; then failed=1; fi
          done
          docker stop tg_dense
          exit "$failed"
      - name: Sustained 10Hz acceptance for every full bag
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports=[]
          for p in Path('results').glob('synthetic_*/live_check.json'):
              r=json.loads(p.read_text()); reports.append(r)
              assert r['passed'] and r['received']==r['expected']
              assert r['output_hz']>=9.8, '10Hz budget not met'
          assert len(reports)==3 and sum(r['received'] for r in reports)==1667
          PY
      - name: Verify complete qualification source and export native excerpt
        run: |
          python tools/cloud_dense_data.py public-download https://disk.yandex.ru/d/SfBeRHbs8bNJAQ private_data/qualification/cloud_with_fake_obj.zst --path /cloud_with_fake_obj.zst
          mkdir -p results/qualification
          cp private_data/qualification/cloud_with_fake_obj_source.json results/qualification/source.json
          docker run --rm --network none -v "$PWD/private_data/qualification:/data:ro" -v "$PWD/tools:/tools:ro" -v "$PWD/results:/results" tg_dense python3 /tools/finals_archive_eval.py /data/cloud_with_fake_obj.zst /results/qualification --clip-stride 1 --clip-start 30 --clip-stop 230 --clip-limit 200
          python3 -c "import json; x=json.load(open('results/qualification/summary.json')); assert x['complete'] and x['native'] and x['frames']==1510"
      - name: Normal speed organizer video without scatter target circles
        run: |
          python tools/finals_prepare_video.py results/offline video_project
          python tools/finals_cab_video.py video_project/web results/tunnelguard_organizer.mp4 --rate 1
          cp video_project/web/data/cab_video.json results/
          cp video_project/web/assets/video_poster.png results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dense-organizer-results
          path: results/
