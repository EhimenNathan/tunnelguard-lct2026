# Frozen GUI image verified by Docker CI run 39205365593.
# Use this file for reproducible judging; compose.gui.yaml tracks latest.
services:
  tunnelguard:
    image: ghcr.io/ehimennathan/tunnel_guard_gui@sha256:2561e6a4d1ea163669c9cda33c0cafad2161d17bd7c75aaaf98a15621441a25d
    platform: linux/amd64
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - "${TG_BAGS_DIR:-./bags}:/data:ro"
    environment:
      TG_VNC_PASSWORD: "${TG_VNC_PASSWORD:-tunnelguard}"
      TG_GUI_AUTOSTART: "${TG_GUI_AUTOSTART:-1}"
    shm_size: 512mb
    init: true
    stop_grace_period: 20s
