# Frozen GUI image verified by Docker CI run 39023316258.
# Use this file for reproducible judging; compose.gui.yaml tracks latest.
services:
  tunnelguard:
    image: ghcr.io/ehimennathan/tunnel_guard_gui@sha256:c3c759358b8c309eb808f547e2fa7054f110f6fb38ffcf6fa2f60fc0a6dcf639
    platform: linux/amd64
    ports:
      - "127.0.0.1:6080:6080"
    volumes:
      - "${TG_BAGS_DIR:-./bags}:/data:ro"
    environment:
      TG_VNC_PASSWORD: "${TG_VNC_PASSWORD:-tunnelguard}"
      TG_GUI_AUTOSTART: "${TG_GUI_AUTOSTART:-1}"
    shm_size: 512mb
    init: true
    stop_grace_period: 20s
